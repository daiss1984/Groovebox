<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Groovebox 网盘音乐播放器">
<meta name="theme-color" content="#111113">
<title>Groovebox · 云端唱片室</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#home"><span class="brand-mark"><i data-icon="audio-lines"></i></span><span>Groovebox<small>云端唱片室</small></span></a>
    <nav aria-label="主导航">
      <div class="nav-heading">音乐</div>
      <button data-nav="home"><i data-icon="house"></i>发现</button>
      <button data-nav="songs"><i data-icon="music-2"></i>全部歌曲</button>
      <button data-nav="albums"><i data-icon="disc-3"></i>专辑</button>
      <button data-nav="artists"><i data-icon="mic-2"></i>艺人</button>
      <button data-nav="genres"><i data-icon="list-music"></i>分类</button>
      <div class="nav-heading">我的音乐</div>
      <button data-nav="favorites"><i data-icon="heart"></i>我喜欢的</button>
      <button data-nav="history"><i data-icon="history"></i>最近播放</button>
      <button data-nav="offline"><i data-icon="download"></i>已下载音乐</button>
      <div class="nav-heading nav-playlist">歌单 <span class="nav-playlist-actions"><span id="playlist-order-control"></span><button class="icon-btn" data-action="new-playlist" aria-label="新建歌单" title="新建歌单"><i data-icon="plus"></i></button></span></div>
      <div id="playlist-nav"></div>
      <button class="add-playlist" data-action="new-playlist"><i data-icon="list-plus"></i>新建歌单</button>
      <button data-action="import-m3u"><i data-icon="upload"></i>导入 M3U 歌单</button>
      <div class="nav-heading">音乐来源</div>
      <button data-nav="sources"><i data-icon="cloud"></i>音乐来源<span id="source-indicator"></span></button>
    </nav>
    <div class="side-bottom"><button data-nav="settings"><i data-icon="settings-2"></i>设置</button><div class="side-foot"><span></span> GROOVEBOX WEB</div></div>
  </aside>
  <main class="workspace">
    <header class="topbar">
      <div class="top-left">
        <button class="icon-btn mobile-only" data-action="menu" aria-label="菜单"><i data-icon="menu"></i></button>
        <button class="icon-btn top-circle desktop-control" data-action="back" title="后退" aria-label="后退"><i data-icon="chevron-left"></i></button>
        <button class="icon-btn top-circle desktop-control" data-action="forward" title="前进" aria-label="前进"><i data-icon="chevron-right"></i></button>
        <label class="search"><i data-icon="search"></i><input id="search" placeholder="搜索歌曲、艺人、专辑、文件夹、风格…" autocomplete="off" type="search" aria-label="搜索"><kbd>⌘ K</kbd></label>
      </div>
      <div class="top-right">
        <button type="button" class="icon-btn" id="scroll-top" data-action="scroll-top" aria-label="回到顶部" title="回到顶部" hidden><i data-icon="arrow-up-to-line"></i></button>
        <button class="connect-btn" data-nav="sources" aria-label="连接网盘"><i data-icon="cloud"></i><span>连接网盘</span></button>
        <button class="avatar" data-nav="settings" aria-label="设置" title="设置">G</button>
      </div>
    </header>
    <div id="content" tabindex="-1"></div>
  </main>
  <aside class="now" id="now" aria-label="正在播放"></aside>
</div>
<footer class="player" aria-label="音乐播放器">
  <div class="player-track"><button id="player-art" class="play-art" data-action="immersive" aria-label="沉浸播放"><i data-icon="music-2"></i></button><button class="play-info" data-action="locate-playing" title="定位当前歌曲" aria-label="定位当前歌曲" aria-describedby="player-title player-artist" disabled><strong id="player-title">选择一首歌曲</strong><span id="player-artist">Groovebox</span></button><button class="icon-btn" id="player-heart" data-action="favorite-current" title="收藏" aria-label="收藏"><i data-icon="heart"></i></button></div>
  <div class="player-center">
    <div class="transport">
      <button class="icon-btn" data-action="shuffle" id="shuffle" title="随机播放" aria-label="随机播放" aria-pressed="false"><i data-icon="shuffle"></i></button>
      <button class="icon-btn skip" data-action="previous" aria-label="上一首" title="上一首"><i data-icon="skip-back"></i></button>
      <button class="icon-btn play-main" data-action="toggle" aria-label="播放" id="player-toggle"><i data-icon="play"></i></button>
      <button class="icon-btn skip" data-action="next" aria-label="下一首" title="下一首"><i data-icon="skip-forward"></i></button>
      <button class="icon-btn" data-action="repeat" title="循环播放" aria-label="循环播放" id="repeat"><i data-icon="repeat-2"></i></button>
    </div>
    <div class="timeline"><span id="current-time">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"><span id="duration">0:00</span></div>
  </div>
  <div class="player-options">
    <button class="icon-btn" data-action="mute" title="静音" aria-label="静音" id="mute"><i data-icon="volume-2"></i></button><input type="range" min="0" max="100" value="80" id="volume" aria-label="音量">
    <span class="divider"></span>
    <button class="icon-btn" data-action="cast" aria-label="投屏" title="投屏" aria-pressed="false"><i data-icon="cast"></i></button>
    <button class="icon-btn" data-action="queue-panel" aria-label="播放队列" title="播放队列"><i data-icon="list-music"></i></button>
    <button class="icon-btn fullscreen" data-action="immersive" aria-label="沉浸播放" title="沉浸播放"><i data-icon="maximize-2"></i></button>
  </div>
</footer>
<audio id="audio" preload="metadata"></audio>
<input id="import-files" type="file" hidden multiple accept="audio/*,.flac,.m4a,.ape,.opus,.ogg,.aiff,.aac,.dsf,.dff,.wv,.tta,.dts,.lrc,.vtt,.yrc,.qrc,.krc">
<input id="import-folder" type="file" hidden multiple webkitdirectory>
<input id="import-m3u-file" type="file" hidden accept=".m3u,.m3u8,audio/x-mpegurl,application/vnd.apple.mpegurl">
<input id="restore-file" type="file" hidden accept="application/json,.json">
<input id="history-restore-file" type="file" hidden accept="application/json,.json">
<input id="background-file" type="file" hidden accept="image/*">
<dialog id="dialog"></dialog>
<aside class="toast" id="toast" role="status" hidden></aside>
</body>
</html>
